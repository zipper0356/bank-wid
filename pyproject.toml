[project]
name = "new-projekt3"
version = "0.1.0"
description = ""
authors = [
    {name = "new-projekt3"}
]
requires-python = ">=3.14"
dependencies = [
]

[dependency-groups]
dev = [
    "yes (>=0.0.1,<0.0.2)"
]
lint = [
    "flake8 (>=7.0.0,<8.0.0)",
    "black (>=24.0.0,<25.0.0)",
    "isort (>=5.0.0,<6.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
